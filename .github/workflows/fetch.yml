name: 탄소배출권 가격 자동 수집

on:
  schedule:
    # 매일 한국시간(KST) 오전 9시 = UTC 0시
    # 공공데이터는 전일 데이터를 당일 오후 1시 이후 제공하므로 넉넉히 오전 실행
    - cron: '0 0 * * *'
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write       # data 파일 커밋 권한

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 가격 수집 실행
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python3 fetch_prices.py

      - name: 변경사항 커밋
        run: |
          git config user.name "carbon-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 (휴장일 또는 동일 데이터)"
          else
            git commit -m "데이터 자동 갱신: $(date +'%Y-%m-%d')"
            git push
            echo "✅ 데이터 갱신 및 커밋 완료"
          fi
